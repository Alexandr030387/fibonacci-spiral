<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filling The Matrix</title>
    <style>
        /* Styles for the spiral effect */
        body { font-family: Arial, sans-serif; }
        #spiral { display: grid; }
        /* Other styles for the matrix and animation */
    </style>
    <script>
        function createMatrix(n) {
            let matrix = Array.from(Array(n), () => Array(n).fill(0));
            let value = 1;
            let x = Math.floor(n / 2);
            let y = Math.floor(n / 2);
            let spiralLength = 1;
            let direction = 0;
            let directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];

            while (value <= n * n) {
                for (let i = 0; i < spiralLength; i++) {
                    if (value % 6 !== 0) {
                        matrix[x][y] = value;
                        value++;
                    }
                    x += directions[direction][0];
                    y += directions[direction][1];
                }
                direction = (direction + 1) % 4;
                if (direction % 2 === 0) spiralLength++;
            }
            return matrix;
        }

        function drawMatrix(matrix) {
            const container = document.getElementById('spiral');
            container.innerHTML = '';
            matrix.forEach(row => {
                const rowDiv = document.createElement('div');
                row.forEach(value => {
                    const cell = document.createElement('span');
                    cell.innerText = value;
                    rowDiv.appendChild(cell);
                });
                container.appendChild(rowDiv);
            });
        }

        function start() {
            const size = parseInt(document.getElementById('sizeInput').value);
            const speed = parseInt(getHashParameter('speed')) || 1000;
            const matrix = createMatrix(size);
            drawMatrix(matrix);
            // Implement animation effect based on speed
        }

        function getHashParameter(param) {
            const hash = window.location.hash.substr(1);
            const vars = hash.split('&');
            for (const pair of vars) {
                const [key, value] = pair.split('=');
                if (key === param) return value;
            }
            return null;
        }
    </script>
</head>
<body>
    <h1>Filling the Matrix with Fibonacci Spiral</h1>
    <input type="number" id="sizeInput" min="1" placeholder="Enter size of matrix" required />
    <button onclick="start()">Generate Spiral</button>
    <div id="spiral"></div>
</body>
</html>

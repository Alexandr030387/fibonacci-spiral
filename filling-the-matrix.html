<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Spiral</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .input-section {
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 100px;
            border: 2px solid #3498db;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 5px;
            margin-top: 20px;
        }
        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            background-color: white;
            border: 2px solid #ddd;
            border-radius: 4px;
            transition: background-color 0.5s, transform 0.5s;
        }
        .animated {
            animation: spin 1s;
        }
        @keyframes spin {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fibonacci Spiral Matrix</h1>
        <div class="input-section">
            <input type="number" id="inputNumber" min="1" max="1000" placeholder="1-1000" required />
            <button id="goButton">Go</button>
        </div>
        <div class="matrix" id="matrix"></div>
    </div>
    <script>
        async function createSpiralMatrix(n) {
            const matrix = Array.from({ length: n }, () => Array(n).fill(0));
            let num = 1;
            let top = 0, left = 0, bottom = n - 1, right = n - 1;

            while (top <= bottom && left <= right) {
                for (let i = left; i <= right; i++) {
                    if (!String(num).includes('6')) {
                        matrix[top][i] = num;
                        createCell(top, i, num);
                    }  
                    num++;
                    await delay(animation_speed);
                }
                top++;
                for (let i = top; i <= bottom; i++) {
                    if (!String(num).includes('6')) {
                        matrix[i][right] = num;
                        createCell(i, right, num);
                    }
                    num++;
                    await delay(animation_speed);
                }
                right--;
                if (top <= bottom) {
                    for (let i = right; i >= left; i--) {
                        if (!String(num).includes('6')) {
                            matrix[bottom][i] = num;
                            createCell(bottom, i, num);
                        }
                        num++;
                        await delay(animation_speed);
                    }
                    bottom--;
                }
                if (left <= right) {
                    for (let i = bottom; i >= top; i--) {
                        if (!String(num).includes('6')) {
                            matrix[i][left] = num;
                            createCell(i, left, num);
                        }
                        num++;
                        await delay(animation_speed);
                    }
                    left++;
                }
            }
        }

        function createCell(row, col, value) {
            const cell = document.createElement('div');
            cell.className = 'cell animated';
            cell.innerText = value;
            document.getElementById('matrix').appendChild(cell);
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        document.getElementById('goButton').addEventListener('click', () => {
            const inputNumber = parseInt(document.getElementById('inputNumber').value);
            if (inputNumber >= 1 && inputNumber <= 1000) {
                document.getElementById('matrix').innerHTML = '';
                createSpiralMatrix(inputNumber);
            } else {
                alert('Please enter a number between 1 and 1000.');
            }
        });

        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const animation_speed = parseInt(urlParams.get('animation_speed')) || 500;
    </script>
</body>
</html>
